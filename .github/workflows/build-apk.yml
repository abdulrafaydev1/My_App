name: Build InstaGuard APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual one-click trigger in GitHub Actions tab

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found, generating wrapper using system gradle..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Artifact
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/InstaGuard.apk
          ls -lh build-output/InstaGuard.apk

      - name: Upload InstaGuard.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaGuard-debug-apk
          path: build-output/InstaGuard.apk
          retention-days: 14
