name: Build InstaGuard APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Run Unit Tests & Build Debug APK with Gradle
        run: |
          set -o pipefail
          gradle compileDebugKotlin --stacktrace --no-daemon 2>&1 | tee compile.log || {
            grep -E "e: |FAILED|FAILURE" compile.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon 2>&1 | tee test.log || {
            grep -E "FAILED|FAILURE|failure|e: " test.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Upload InstaGuard-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaGuard-v10.0-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
