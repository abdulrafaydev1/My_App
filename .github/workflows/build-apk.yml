name: Build InstaGuard APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Run Unit Tests & Build Debug APK with Gradle
        run: |
          set -o pipefail
          gradle compileDebugKotlin --stacktrace --no-daemon 2>&1 | tee compile.log || {
            echo "::error::Compilation failed. Printing compile.log:"
            cat compile.log
            exit 1
          }
          gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon 2>&1 | tee test.log || {
            echo "::error::Tests or packaging failed. Printing test.log:"
            cat test.log
            exit 1
          }

      - name: Upload InstaGuard-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaGuard-v15.3-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            *.log
            app/build/reports/
          retention-days: 7
